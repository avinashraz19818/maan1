            var tyid = categoryIdFromBody(bodyObj);
            finishXhr(self, okPayload(amt, { tyid: tyid, usdt: isUsdtPay(bodyObj) }));
            return;
          }
        }
        if (ep === "GetArUpiOnGoingOrder" || ep === "ArUpiCancel") {
          finishXhr(self, arupiStub());
          return;
        }
        if (ep === "GetRechargeCategoryList" || ep === "GetWithdrawBasicInfo" || ep === "GetUserWithdrawWallet") {
          var fast = instantWallet(ep);
          if (fast) {
            if (ep === "GetRechargeCategoryList") cacheCategoryIds(fast);
            finishXhr(self, fast);
            bgRefresh(self, body, ep);
            return;
          }
        }
        if (ep === "GetWalletCodeList") {
          var cached = readApiCache(ep);
          if (cached) {
            finishXhr(self, cached);
            bgRefresh(self, body, ep);
            return;
          }
          this.addEventListener("load", function () {
            try {
              var obj = JSON.parse(self.responseText || "{}");
              if (obj && obj.code === 0) writeApiCache(ep, obj);
            } catch (e) {}
          });
        }
        if (ep === "GetShareCopy") {
          this.addEventListener("readystatechange", function () {
            if (self.readyState !== 4) return;
            try {
              var obj = wrapShare(JSON.parse(self.responseText || "{}"));
              var raw = JSON.stringify(obj);
              Object.defineProperty(self, "responseText", { configurable: true, get: function () { return raw; } });
              Object.defineProperty(self, "response", {
                configurable: true,
                get: function () {
                  if (self.responseType === "json") return obj;
                  return raw;
                }
              });
            } catch (e) {}
          });
        }
        return XS.call(this, body);
      };

      function readScreenAmount() {
        var inp = document.querySelector(".pay-main input, .amount-input input, .Recharge__content-paymoney__money-input input");
        if (inp && inp.value) {
          var n = Number(String(inp.value).replace(/,/g, "").replace(/[^\d.]/g, ""));
          if (n > 0) return n.toFixed(2);
        }
        var chip = document.querySelector(".amount-option.active");
        if (chip) {
          var t = String(chip.textContent || "").replace(/,/g, "");
          var m = t.match(/(\d+(\.\d+)?)/);
          if (m && Number(m[1]) > 0) return Number(m[1]).toFixed(2);
        }
        return null;
      }
      function activePayName() {
        var el = document.querySelector(".payment-item.active .name") || document.querySelector(".payment-item.active");
        return String((el && el.textContent) || "").toLowerCase();
      }
      document.addEventListener("click", function (ev) {
        var t = ev.target;
        if (!t || !t.closest) return;
        var path = (String(location.pathname || "") + " " + String(location.hash || "")).toLowerCase();
        if (path.indexOf("/wallet/recharge") === -1) return;
        var btn = t.closest(".pay-btn .red-btn") || t.closest(".pay-btn");
        if (!btn) return;
        var name = activePayName();
        if (name.indexOf("arpay") !== -1) return;
        var amt = readScreenAmount();
        if (!amt) return;
        try {
          ev.preventDefault();
          ev.stopPropagation();
          if (ev.stopImmediatePropagation) ev.stopImmediatePropagation();
        } catch (e) {}
        openPayTab(payUrl(amt, { usdt: name.indexOf("usdt") !== -1 }));
      }, true);
    })();
    </script>
</body>
